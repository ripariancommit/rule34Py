name: Upstream Testing
# This pipeline periodically tests the project against the upstream (rule34.xxx) server.
# It's purpose is to detect breaking changes to the upstream API.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-upstream-api:
    name: Test Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Build the project
        uses: ./.github/actions/build-project
        with:
          python-version: '3.x'

      - name: Run Unit Tests
        shell: bash
        run: |
          python -m pip install .[test]
          R34_MOCK=False python -m pytest -v tests/unit -m 'not captcha'
